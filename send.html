<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send Request — Noeractivator</title>
  <meta name="description" content="Kirim permintaan aktivasi Alight Motion melalui Noeractivator." />
  <meta name="theme-color" content="#2563EB" id="meta-theme" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("noer_theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("meta-theme");
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0B0F14" : "#2563EB");
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #FFFFFF; --bg-soft: #F7F8FA; --bg-muted: #F1F3F5;
      --text: #17191C; --text-2: #6B7280; --text-3: #9CA3AF;
      --border: #E5E7EB; --border-soft: #EEF0F3;
      --nav-bg: rgba(255,255,255,.85);
      --accent: #2563EB; --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF; --accent-border: #BFDBFE;
      --error: #DC2626; --error-soft: #FEF2F2; --error-border: #FECACA;
      --success: #16A34A; --success-soft: #F0FDF4; --success-border: #BBF7D0;
      --radius-lg: 20px; --radius: 14px; --radius-sm: 10px;
      --shadow-xs: 0 1px 2px rgba(16,24,40,.04);
      --shadow-sm: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.03);
      --shadow-md: 0 8px 24px -12px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.04);
      --overlay: rgba(16,24,40,.35);
    }
    :root[data-theme="dark"] {
      --bg: #0B0F14; --bg-soft: #0B0F14;
      --bg-muted: #1B2330;
      --text: #E6EAF0; --text-2: #9BA6B4; --text-3: #6B7688;
      --border: #26303D; --border-soft: #1B2330;
      --nav-bg: rgba(11,15,20,.82);
      --accent: #3B82F6; --accent-hover: #60A5FA;
      --accent-soft: rgba(59,130,246,.12); --accent-border: rgba(59,130,246,.35);
      --error: #F87171; --error-soft: rgba(248,113,113,.10); --error-border: rgba(248,113,113,.30);
      --success: #4ADE80; --success-soft: rgba(74,222,128,.10); --success-border: rgba(74,222,128,.30);
      --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 8px 24px -12px rgba(0,0,0,.6);
      --overlay: rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body, .nav, .form-card, .input, .theme-toggle, .btn-secondary {
      transition: background-color .25s ease, border-color .25s ease, color .25s ease;
    }
    body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    .container-narrow { max-width: 520px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }
    .nav { position: sticky; top: 0; z-index: 100; background: var(--nav-bg); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--border-soft); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; gap: 12px; }
    .brand { display: inline-flex; align-items: center; flex-shrink: 0; }
    .brand-logo { height: 56px !important; min-height: 56px !important; width: auto !important; max-width: none !important; max-height: none !important; aspect-ratio: 1612 / 609; object-fit: contain; display: block; transition: transform .3s ease; }
    .brand:hover .brand-logo { transform: scale(1.03); }
    .brand-fallback { font-weight: 800; font-size: 20px; color: var(--text); letter-spacing: -.01em; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .theme-toggle { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: 1px solid var(--border-soft); cursor: pointer; color: var(--text); display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s, transform .15s; }
    .theme-toggle:hover { background: var(--bg-soft); border-color: var(--border); }
    .theme-toggle:active { transform: scale(.94); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 22px; font-size: 14px; font-weight: 600; letter-spacing: -.005em; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; text-align: center; white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s, transform .08s, opacity .15s; position: relative; overflow: hidden; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.2), 0 4px 12px -4px rgba(37,99,235,.3); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 1px 2px rgba(37,99,235,.25), 0 6px 16px -4px rgba(37,99,235,.4); transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(1px); }
    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-xs); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-soft); transform: translateY(-1px); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .btn-block { width: 100%; }
    .btn .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); animation: ripple .6s ease-out; pointer-events: none; }
    .page { padding: 48px 0 80px; }
    .page-head { margin-bottom: 28px; }
    .page-head h1 { font-size: clamp(24px, 3.6vw, 32px); font-weight: 800; letter-spacing: -.025em; margin: 0 0 8px; }
    .page-head p { color: var(--text-2); font-size: 15px; margin: 0; max-width: 480px; line-height: 1.6; }
    .form-card { padding: 32px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
    .field { margin-bottom: 20px; }
    .field:last-of-type { margin-bottom: 24px; }
    .field label { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 8px; letter-spacing: -.005em; }
    .input { width: 100%; padding: 13px 15px; font-size: 15px; font-family: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color .15s, box-shadow .15s; }
    .input::placeholder { color: var(--text-3); }
    .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .input.input-error { border-color: var(--error); }
    .input.input-error:focus { box-shadow: 0 0 0 3px rgba(220,38,38,.15); }
    .field-error { display: block; margin-top: 6px; font-size: 12.5px; color: var(--error); font-weight: 500; }
    .field-error[hidden] { display: none; }
    .field-check { display: flex; align-items: flex-start; gap: 12px; }
    .field-check input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
    .field-check label { font-size: 13.5px; font-weight: 400; color: var(--text-2); margin: 0; cursor: pointer; line-height: 1.55; }
    .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
    .action-group .btn { margin: 0; }
    .verify-hint { display: block; font-size: 12px; color: var(--text-3); text-align: center; margin-top: 10px; line-height: 1.5; }
    .verify-hint[hidden] { display: none; }
    .notification { margin-top: 22px; padding: 14px 16px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.55; border: 1px solid; }
    .notification[hidden] { display: none; }
    .notification-success { background: var(--success-soft); border-color: var(--success-border); color: var(--success); }
    .notification-error { background: var(--error-soft); border-color: var(--error-border); color: var(--error); }
    .notification-info { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-hover); }
    .quota-info { margin-top: 18px; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 13px; color: var(--accent-hover); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .quota-info[hidden] { display: none; }
    .quota-info b { color: var(--accent); font-weight: 700; }
    .btn-spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
    .btn-spinner[hidden] { display: none; }
    @media (max-width: 768px) {
      .container { padding: 0 18px; }
      .nav-inner { height: 68px; }
      .brand-logo { height: 44px !important; min-height: 44px !important; }
      .form-card { padding: 24px; border-radius: var(--radius); }
      .page { padding: 32px 0 64px; }
    }
    @media (max-width: 480px) {
      .brand-logo { height: 40px !important; min-height: 40px !important; }
      .action-group { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand" aria-label="Noeractivator">
        <img src="assets/logo-light.svg" alt="Noeractivator" class="brand-logo" data-theme-logo="1"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-fallback',textContent:'Noeractivator'}));" />
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Ubah tema">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <a href="index.html" class="btn btn-secondary btn-sm">Kembali</a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container container-narrow">
      <header class="page-head reveal">
        <h1>Send Activation Request</h1>
        <p>Masukkan email aktif untuk memulai proses permintaan aktivasi.</p>
      </header>

      <div class="form-card reveal delay-1">
        <form id="send-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="input" placeholder="noerparties@email.com" autocomplete="email" inputmode="email" required />
            <span class="field-error" id="email-error" hidden></span>
          </div>

          <div class="field field-check">
            <input type="checkbox" id="agree" />
            <label for="agree">
              Saya mengakui bahwa noerparties adalah cwo gantenkk dan saya tidak akan menyalah gunakan website ini.
            </label>
          </div>

          <div class="action-group">
            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
              <span class="btn-label">Send Request</span>
              <span class="btn-spinner" hidden></span>
            </button>
            <a href="verif.html" class="btn btn-secondary btn-block" id="verify-link" aria-disabled="true" tabindex="-1">Verify</a>
          </div>
          <span class="verify-hint" id="verify-hint">Tombol Verify aktif setelah permintaan berhasil dikirim.</span>
        </form>

        <div class="notification" id="notification" hidden></div>
        <div class="quota-info" id="quota-info" hidden></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
